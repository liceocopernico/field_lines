[project]
name = "field-lines"
version = "0.2.0"
description = "Electric field lines, equipotentials and capacitors in 2D and 3D, with a Qt + PyVista GUI"
readme = "README.md"
authors = [
    { name = "Matteo Mosangini", email = "mosangini.matteo@liceocopernico.org" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.17",
    "pyvista>=0.49",
    "pyvistaqt>=0.13",
    "PySide6>=6.10",
]

[project.scripts]
field-lines = "field_lines.app:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["render: needs OpenGL rendering"]
filterwarnings = [
    # VTK's numpy_support sets array.shape, deprecated in NumPy 2.5
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:vtkmodules",
]
